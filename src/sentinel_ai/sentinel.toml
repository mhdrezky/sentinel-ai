# Organisation-wide Sentinel-AI configuration (template).
#
# Bundled defaults — copied into the package at build/install time.
# Per-machine overrides: ~/.sentinel-ai/config.toml (auto-created by install.ps1 / install.sh)
#
# Inspect active config: sentinel-ai config

[policy]
# Block commits at this severity or above: low | medium | high | critical
block_at_or_above = "high"

# Block newly added packages that run code at install time (npm install hooks)
block_on_install_scripts = true

# Block dependencies from git/http/file instead of the public registry
block_on_nonregistry_source = true

# Add entries only after a reviewed false positive or approved internal package
allowlist = []

# Add entries only for organisation-wide bans — keep empty unless needed
denylist = []

[ai]
# How to reach the model server. Override base_url and model in
# ~/.sentinel-ai/config.toml on each host. Turning this off disables every
# AI stage; the budgets themselves live in [diff_review].
enabled = true
base_url = "http://localhost:8000/v1"
model = "local-model"
enable_thinking = false

[diff_review]
# Reviews the staged *code* diff — orthogonal to the dependency check above.
enabled = true

# An unreachable model server warns and lets the commit through
fail_open = true

# Deliberately separate from [ai]: this reviewer returns a tiny JSON verdict
# and runs on every commit, so tuning the dependency reviewer must not move it
max_output_tokens = 256
timeout_seconds = 12.0

# Diffs above this skip the model entirely — truncating would hide findings
max_diff_bytes = 40_000

# Appended inside the repository's git directory
log_file = "ai-review.jsonl"
log_findings = false

[trivy]
# Installers set this to ~/.sentinel-ai/bin/trivy(.exe) when auto-install succeeds
enabled = true
binary_path = "trivy"
timeout_seconds = 60.0
skip_db_update = false
offline = false
